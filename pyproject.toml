[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eit-host"
version = "0.1.0"
description = "Host software for an ADMX2001-based EIT measurement system"
requires-python = ">=3.10"

dependencies = [
    "pyserial>=3.5",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]